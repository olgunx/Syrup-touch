; PlatformIO configuration for Syrup Touch Mixer
; Board: LOLIN S2 Mini (ESP32-S2, 4MB Flash, 2MB PSRAM)
; Display: ILI9341 240x320 + XPT2046 touch (shared SPI)
; Motors: 8x L9110S channels via GPIO

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<*> -<hal_sim.cpp>

lib_deps =
    bodmer/TFT_eSPI@^2.5.0

build_flags =
    ; --- Enable native USB CDC serial output ---
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI configuration (replaces User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; SPI pins (FSPI hardware SPI on ESP32-S2)
    -DTFT_MOSI=35
    -DTFT_MISO=37
    -DTFT_SCLK=36
    ; Display control pins
    -DTFT_CS=34
    -DTFT_DC=33
    -DTFT_RST=18
    ; Touch (XPT2046, shared SPI bus)
    -DTOUCH_CS=16
    ; SPI clock speeds
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; Fonts to include
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1

; -------------------------------------------------------
; PC Simulator — SDL2 window, same C++ logic as ESP32
; Prerequisites: sudo apt install libsdl2-dev
; Usage:  pio run -e simulator -t exec
; -------------------------------------------------------
[env:simulator]
platform = native
build_src_filter = +<*> -<hal_esp32.cpp>
build_flags =
    -lSDL2
    -lSDL2_ttf
    -std=c++17
    -I include
